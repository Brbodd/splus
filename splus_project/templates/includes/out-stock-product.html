{% load static %}
<div class='product-element'>
    <a class='out-product no-background' href="{% url 'product-detail' product.slug %}">
        <p class='out-of-stock-tag'> موجود </p>
        <img class='product-img img-shadow no-background center-div' src="{{ product.img }}">
        <h2 class='no-background'> {{ product.name }}</h2>
        <h3 class='no-background'> {{ product.code }} </h3>
        {{ product.price }}
    </a>
</div>
