{% load static %}

<div class='product-element flex-center'>
    <a class='out-product no-background' href="{{ product.get_absolute_url }}">

        <p class='out-of-stock-tag'> ناموجود </p>

        <img
            class='product-img img-shadow no-background center-div'
            src="{{ product.image_src }}"
            alt=''>

        <h2 class='product-name no-background'>
            {{ product.name }}
        </h2>

        <div class='flex-center'>
            <h3 class='product-code flex-center'>
                {{ product.code }}
            </h3>
        </div>

        {{ product.price }} تومان

    </a>
</div>
