{% load static %}
<div class='product-element'>
    <a class='no-background' href="{% url 'product-detail' product.slug %}">
        <p class='in-stock-tag'> موجود </p>
        <img class='product-img img-shadow no-background center-div' src="{{ product.img }}" alt=''>
        <h2 class='no-background'> {{ product.name }} </h2>
        <h3 class='no-background'> {{ product.code}} </h3>
        {{ product.price }} تومان
    </a>
</div>
